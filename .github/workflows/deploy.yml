# Deploys the static site at the repo root (index.html, assets) to GitHub Pages.
# Pages source in repo settings must be set to "GitHub Actions" (not "Deploy from a branch").
#
# This repo has no package.json / Vite build. If you later add a Node app, replace the
# middle steps with setup-node, npm ci, npm run build, and set upload path to your dist folder.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
